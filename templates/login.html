{% extends '_auth_shell.html' %}
{% block title %}Sign in{% endblock %}

{% block form %}
<h2>Welcome back</h2>
<p>Sign in with the email address or mobile number you registered.</p>

<form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
        <label class="field__label" for="identifier">Email or mobile number</label>
        <input class="input" id="identifier" name="identifier" type="text"
               value="{{ identifier }}" autocomplete="username"
               placeholder="you@example.com" required autofocus>
    </div>

    <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" required>
    </div>

    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
</form>

<div class="auth__switch">
    New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
</div>
{% endblock %}
